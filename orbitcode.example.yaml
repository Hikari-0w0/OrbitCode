providers:
  - name: primary
    protocol: openai
    model: example-model
    base_url: https://example.invalid/v1
    api_key: MODEL_API_KEY
    # 官方 DeepSeek API 需要显式使用以下参数风格；SiliconFlow 可省略 api_style。
    # thinking:
    #   enabled: false
    #   api_style: deepseek
    transport:
      first_byte_timeout_ms: 30000
      idle_timeout_ms: 300000
      total_timeout_ms: 600000
      max_retries: 1
    context:
      # 请按实际模型填写上下文窗口；128000 只是示例值。
      window_tokens: 128000
      single_tool_result_tokens: 8000
      tool_result_group_tokens: 12000
      recent_messages_tokens: 10000
      automatic_reserve_tokens: 13000
      manual_reserve_tokens: 3000
      preview_chars: 2000
      operational_compaction_tokens: 24000
      recent_tool_exchanges: 4
